server:
  port: 8080
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_CONNECTION_STRING:jdbc:postgresql://postgres-db:5432/testseed?sslmode=require}
    username: ${DB_USERNAME:testseed_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
mavis:
  services:
    catalog-service-url: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
